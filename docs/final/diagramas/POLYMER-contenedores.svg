<text x="1160.0" y="308.1" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">cola notifications + DLQ</text>
<text x="1160.0" y="325.3" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">consola :15672</text>
