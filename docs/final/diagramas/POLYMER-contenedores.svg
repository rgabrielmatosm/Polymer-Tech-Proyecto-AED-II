<text x="850.0" y="43.7" font-size="22" font-weight="bold" fill="#0F172A" text-anchor="middle">POLYMER · 13 contenedores de Docker Compose (enlaces solo en 127.0.0.1)</text>
<text x="850.0" y="986.2" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle">Redes: edge · gateway · data (solo order-api ↔ PostgreSQL) · compute · cache · messaging · telemetry · egress (salida a Internet solo para order-api)</text>
<text x="510.0" y="278.8" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">order-api</text>
<text x="510.0" y="296.0" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">Java 21 · Spring Boot 3.5</text>
<text x="510.0" y="313.1" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">NÚCLEO HEXAGONAL</text>
<text x="510.0" y="330.3" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">:8081 (directo) · gestión :9090</text>
<text x="1470.0" y="150.2" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">prometheus · :9091</text>
<text x="1470.0" y="167.4" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">lee cada 10 s: order-api :9090,</text>
<text x="1470.0" y="184.6" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">risk-engine /metrics, rabbitmq,</text>
<text x="1470.0" y="201.7" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">nginx, loki, tempo, alloy</text>
<text x="1470.0" y="218.9" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">9 reglas de alerta</text>
<text x="510.0" y="493.8" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">risk-engine</text>
<text x="510.0" y="511.0" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">Python 3.12 · FastAPI</text>
<text x="510.0" y="528.1" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">microservicio hexagonal</text>
<text x="510.0" y="545.3" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">:8000 (/docs)</text>
<text x="850.0" y="793.8" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">redis 7</text>
<text x="850.0" y="811.0" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">caché catálogo (TTL 60 s)</text>
<text x="850.0" y="828.1" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">QR Yape/Plin (TTL 60 s)</text>
